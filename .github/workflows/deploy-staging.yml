name: Deploy to macOS Staging

on:
  push:
    branches:
      - main  
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup SSH Access
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to macOS server
      run: ssh -o StrictHostKeyChecking=no -p 443 zplaydev@gnat-fleet-sheep.ngrok-free.app "bash ~/code/z-school-backend/deploy.sh"
